[package]
name = "amaru-antivirus"
version = "1.0.0"
description = "Amaru Antivirus desktop application for Windows"
authors = ["Amaru Project"]
license = "GPL-2.0"
repository = "https://github.com/CripterHack/Amaru"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
amaru = { path = "../.." }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tokio = { version = "1", features = ["sync", "rt-multi-thread"] }
walkdir = "2"
tempfile = "3"
dirs = "5"
sysinfo = "0.29"

[target.'cfg(windows)'.dependencies]
tauri = { version = "1.8", features = ["dialog-open", "dialog-ask", "shell-open", "icon-ico"] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[workspace]
