name: Development validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: -r scripts/requirements-signatures.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev
      - run: cargo test --locked -p yara-engine

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check repository links and heading anchors
        run: |
          archive=lychee-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/$archive"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          git ls-files -z '*.md' | xargs -0 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-musl/lychee" --offline --include-fragments --no-progress
