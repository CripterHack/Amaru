name: Development validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signatures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r scripts/requirements-signatures.txt
      - run: python -m unittest discover -s tests -p 'test_*.py' -v

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev libssl-dev
      - run: cargo test --locked -p yara-engine -p realtime-monitor -p updater
      - name: Test static analysis with Radare2
        if: runner.os == 'Linux'
        run: |
          package="$RUNNER_TEMP/radare2.deb"
          curl -fsSL --retry 3 -o "$package" https://github.com/radareorg/radare2/releases/download/6.2.6/radare2_6.2.6_amd64.deb
          echo "0dddf90e217e38a6a658881b9ec7e217198487c75b7f82a332b3cbd30834636f  $package" | sha256sum -c -
          sudo dpkg -i "$package"
          cargo test --locked -p radare2-analyzer

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: gui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build

  documentation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check repository links and heading anchors
        run: |
          archive=lychee-x86_64-unknown-linux-musl.tar.gz
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$archive" "https://github.com/lycheeverse/lychee/releases/download/lychee-v0.24.2/$archive"
          echo "73657a111819a30c47c08352896796f23d64e4eb2b3ed39b6d32149241566fc5  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          git ls-files -z '*.md' | xargs -0 "$RUNNER_TEMP/lychee-x86_64-unknown-linux-musl/lychee" --offline --include-fragments --no-progress
