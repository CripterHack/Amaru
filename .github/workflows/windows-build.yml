name: Windows application build

on:
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'Cargo.*'
      - '**/*.rs'
      - '**/Cargo.toml'
      - 'gui/**'
      - 'scripts/*.ps1'
      - 'installer/**'
      - 'signatures/**'
      - 'config.toml'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: gui/package-lock.json
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          cache-on-failure: true
      - name: Run core, service and CLI tests on Windows
        id: native_tests
        continue-on-error: true
        run: cargo test --locked --package amaru --lib --bins --tests
      - name: Inspect Windows test process startup on failure
        if: steps.native_tests.outcome == 'failure'
        continue-on-error: true
        shell: pwsh
        run: |
          ./scripts/diagnose-startup.ps1
      - name: Build the desktop application and installer
        run: ./scripts/package.ps1
      - name: Exercise the installed application, upgrade and uninstall
        run: ./scripts/test-installed.ps1
      - name: Require successful native tests
        if: always() && steps.native_tests.outcome != 'success'
        run: throw 'Core, service or CLI validation failed.'
      - name: Record the tested installer checksum
        shell: pwsh
        run: |
          $setup = Get-Item 'target/x86_64-pc-windows-msvc/release/AmaruAV-Setup.exe'
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $setup.FullName).Hash.ToLowerInvariant()
          "$digest  $($setup.Name)" | Set-Content -LiteralPath "$($setup.FullName).sha256" -Encoding ascii
          "Installer SHA-256 for $(git rev-parse HEAD) on $env:ImageOS ($env:ImageVersion) — $digest" >> $env:GITHUB_STEP_SUMMARY
      - name: Upload the tested development installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: amaru-windows-x64-development
          if-no-files-found: error
          retention-days: 14
          path: |
            target/x86_64-pc-windows-msvc/release/AmaruAV-Setup.exe
            target/x86_64-pc-windows-msvc/release/AmaruAV-Setup.exe.sha256
